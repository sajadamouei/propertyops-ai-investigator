name: CI

on:
  push:
    branches:
      - main
      - phase-14-cicd

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.6"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --frozen --dev

      - name: Generate deterministic synthetic data
        run: |
          uv run python -c "from pathlib import Path; from propertyops_ai_investigator.data.experiment import ScenarioType, create_scenario_config; from propertyops_ai_investigator.data.generate_synthetic import generate_sensor_readings; path = Path('data/synthetic/sensor_readings.csv'); path.parent.mkdir(parents=True, exist_ok=True); config = create_scenario_config(ScenarioType.HEATING_VALVE_FAULT, days=14, seed=42); generate_sensor_readings(config).to_csv(path, index=False); print(f'Generated {path}')"

      - name: Run Python tests
        run: uv run pytest  

      - name: Run Python tests
        run: uv run pytest

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: >
          docker build
          --file Dockerfile.backend
          --tag propertyops-backend:ci
          .

      - name: Build Azure frontend Docker image
        run: >
          docker build
          --file frontend/Dockerfile.azure
          --tag propertyops-frontend:ci
          frontend