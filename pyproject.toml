[project]
name = "propertyops-ai-investigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.3.15",
    "langchain-google-genai>=4.3.3",
    "matplotlib>=3.11.1",
    "mcp[cli]>=2.0.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
propertyops-ai-investigator = "propertyops_ai_investigator:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
